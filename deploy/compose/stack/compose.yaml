# Every server-side stack in one place. Each stack still owns its compose file, data and secrets
# (its own deploy/.env); this file only includes them, so one command can bring a LOCAL copy of
# everything up:
#
#   docker compose -f services/deploy/compose.yaml up -d api collab searxng
#
# Production runs each stack on its own host with its own project name — use stack.sh, which
# keeps the volume names the stacks were deployed with (agentic-office-data_pgdata, …). Running a
# production host through this file would create new, empty volumes under this project's name.
name: agentic-office-local

include:
  - path: ../accounts-sync/deploy/docker-compose.yml    # Postgres + MinIO + sync/admin API (accounts-sync)
    env_file: ../accounts-sync/deploy/.env
  - path: ../collab/deploy/docker-compose.yml           # collab server + Redis + Caddy
    env_file: ../collab/deploy/.env
  - path: ../research/searxng/docker-compose.yml        # SearXNG for the research service
  - path: ../dag-runtime/deploy/observability/docker-compose.yml   # OTel, Prometheus, Tempo, Grafana
    env_file: ../dag-runtime/deploy/observability/.env
