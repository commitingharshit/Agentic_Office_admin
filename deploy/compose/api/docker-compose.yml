# Agentic Office platform, data plane + API: Postgres (+pgvector) and MinIO, a nightly pg_dump
# into MinIO, the API, its public gate, the package verifier, the status prober and the media worker. Images are built from this repo
# (build context: the repository root); nothing is mounted from the host except config files. Every port binds to BIND_IP only — the Tailscale address in
# production, 127.0.0.1 for a local test — never 0.0.0.0. Clients never talk to
# Postgres directly; the accounts/sync API does.
name: agentic-office-data

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic_office
      POSTGRES_USER: ao_owner
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:?set in .env}
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c log_min_duration_statement=500
        -c max_connections=200
        -c archive_mode=on
        -c archive_timeout=300
        -c "archive_command=test ! -f /backups/wal/%f && cp %p /backups/wal/.%f.part && mv /backups/wal/.%f.part /backups/wal/%f"
    ports:
      - "${BIND_IP:?set in .env}:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ao_owner -d agentic_office"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO stopped publishing images (Docker Hub / quay refuse them), so this is
  # Chainguard's build of the same AGPL source, pinned by digest.
  minio:
    image: chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    restart: unless-stopped
    user: "0"               # the named volume is root-owned
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports:
      - "${BIND_IP}:${MINIO_PORT:-9000}:9000"
      - "${BIND_IP}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  # Creates the buckets (retries until MinIO answers). The mc image has no
  # shell, so the alias comes from MC_HOST_ao.
  minio-init:
    image: chainguard/minio-client@sha256:d8a93c5d335509ff353774eefec8f82fa2a2a975e800139702232d8be3dbe6b9
    depends_on: [minio]
    restart: on-failure
    command: ["mb", "--ignore-existing", "ao/ao-backups", "ao/ao-user-blobs", "ao/ao-growth-media", "ao/ao-marketplace"]
    environment:
      MC_HOST_ao: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000

  # Nightly pg_dump into the backups volume (prunes old dumps, writes LATEST)…
  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ao_owner
      PGPASSWORD: ${PG_OWNER_PASSWORD}
      PGDATABASE: agentic_office
      BACKUP_EVERY_SECONDS: ${BACKUP_EVERY_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
      - pgdata:/pgdata:ro            # read for the physical base backup
    entrypoint: ["/bin/bash", "/backup.sh"]

  # Weekly: restore the newest base backup + WAL into a throwaway Postgres and record the outcome.
  restore-drill:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DRILL_EVERY_SECONDS: ${DRILL_EVERY_SECONDS:-604800}
      DRILL_FIRST_DELAY_SECONDS: ${DRILL_FIRST_DELAY_SECONDS:-600}
    volumes:
      - ./restore-drill.sh:/restore-drill.sh:ro
      - backups:/backups
    entrypoint: ["/bin/bash", "/restore-drill.sh"]

  # …and mirrored to MinIO ao-backups/pg/ as files appear or are pruned.
  backup-mirror:
    image: chainguard/minio-client@sha256:d8a93c5d335509ff353774eefec8f82fa2a2a975e800139702232d8be3dbe6b9
    restart: unless-stopped
    # Root inside the container: archived WAL is written by the postgres server as 0600, and a
    # mirror that cannot read it stops copying EVERYTHING (it did — dumps included).
    user: "0"
    depends_on:
      minio-init: { condition: service_completed_successfully }
    command: ["mirror", "--watch", "--overwrite", "--remove", "--exclude", "*.part", "/backups", "ao/ao-backups/pg"]
    environment:
      MC_HOST_ao: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    volumes:
      - backups:/backups:ro

  # The API. Reads as ao_readonly, acts as ao_admin, audits everything. The Hermes skill scanner and agent compiler live in the
  # `verifier` service (VERIFIER_URL); marketplace uploads answer 503 while it is unreachable, never "accepted unverified".
  api:
    build:
      context: ../../..
      dockerfile: services/api/Dockerfile
    image: ao-api:platform
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      AO_API_BIND: 0.0.0.0
      PG_HOST: postgres
      AO_READONLY_PASSWORD: ${AO_READONLY_PASSWORD}
      AO_ADMIN_PASSWORD: ${AO_ADMIN_PASSWORD}
      AO_ADMIN_TOKENS: ${AO_ADMIN_TOKENS:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      AO_APP_PASSWORD: ${AO_APP_PASSWORD}
      # Our own sign-in (services/control-plane). AUTH_ISSUER is its public base URL; the keys are fetched over the compose network.
      # Announcement email (off unless both are set): Resend's API key and the verified sender address.
      # Signs the app's links to promotion media (32+ characters; without it links only last for one API process).
      AO_MEDIA_SIGNING_KEY: ${AO_MEDIA_SIGNING_KEY:-}
      # Campaign email (src/growth/email.ts). Refused unless the unsubscribe link can work: AO_PUBLIC_URL is the public https address of
      # this API's /v1/unsubscribe and /v1/webhooks/resend (only those two need to be public), AO_UNSUBSCRIBE_KEY signs the links (32+ chars),
      # RESEND_WEBHOOK_SECRET is the webhook's signing secret from Resend (whsec_…).
      AO_PUBLIC_URL: ${AO_PUBLIC_URL:-}
      AO_UNSUBSCRIBE_KEY: ${AO_UNSUBSCRIBE_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AO_MAIL_FROM: ${AO_MAIL_FROM:-}
      # Keycloak (the identity service). Empty = not in use yet. KEYCLOAK_ISSUER is the realm URL exactly as it appears in tokens (the public one);
      # KEYCLOAK_JWKS_URL and KEYCLOAK_ADMIN_URL can be internal addresses on the compose network.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-}
      KEYCLOAK_CLIENT_IDS: ${KEYCLOAK_CLIENT_IDS:-agentic-office-desktop,ao-admin-console}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-}
      KEYCLOAK_API_SECRET: ${KEYCLOAK_API_SECRET:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      # Payments (off unless AO_PAYMENTS is set and the provider settings exist). The provider is experimental; see okf/services/accounts-sync.md.
      AO_BILLING_PASSWORD: ${AO_BILLING_PASSWORD:-}
      AO_PAYMENTS: ${AO_PAYMENTS:-}
      YOUPI_API_URL: ${YOUPI_API_URL:-}
      YOUPI_MERCHANT_ID: ${YOUPI_MERCHANT_ID:-}
      YOUPI_WEBHOOK_SECRET: ${YOUPI_WEBHOOK_SECRET:-}
      AO_CHECKOUT_RETURN_URL: ${AO_CHECKOUT_RETURN_URL:-}
      # Browsers allowed to call /v1 from another origin: empty = any (bearer token, no cookies); or comma-separated exact origins.
      AO_CORS_ORIGINS: ${AO_CORS_ORIGINS:-}
      # Managed inference: credits per 1,000 tokens per model, and the provider behind it.
      AO_PRICING: ${AO_PRICING:-}
      AO_UPSTREAM_URL: ${AO_UPSTREAM_URL:-}
      AO_UPSTREAM_KEY: ${AO_UPSTREAM_KEY:-}
      # Marketplace: blob bucket (created by minio-init), admin roles (adminName:role[,...]; unlisted admins are read-only
      # analysts) and the officecli binary for the template render check (unset: templates cannot reach 'verified').
      AO_MARKETPLACE_BUCKET: ${AO_MARKETPLACE_BUCKET:-ao-marketplace}
      AO_MARKETPLACE_ROLES: ${AO_MARKETPLACE_ROLES:-}
      OFFICECLI_BIN: ${OFFICECLI_BIN:-}
      # The package verifier (Hermes scanner + compiler), on this network only.
      VERIFIER_URL: ${VERIFIER_URL:-http://verifier:8089}
      # Service status: the API's own checks run unless AO_STATUS=off; AO_STATUS_PROBES adds more (JSON list of {id,label,url}).
      AO_STATUS: ${AO_STATUS:-}
      AO_STATUS_PROBES: ${AO_STATUS_PROBES:-}
      # The help assistant (off until a provider is set): an OpenAI-compatible base URL and one or more keys, comma separated.
      AO_HELP_BASE_URL: ${AO_HELP_BASE_URL:-}
      AO_HELP_API_KEYS: ${AO_HELP_API_KEYS:-}
      AO_HELP_CHAT_MODEL: ${AO_HELP_CHAT_MODEL:-}
      AO_HELP_EMBED_MODEL: ${AO_HELP_EMBED_MODEL:-}
    ports:
      - "${BIND_IP}:${API_PORT:-8787}:8787"

  # The only door to the internet for the app's API: a path allow-list in front of `api` (see api-gate.conf). Point Tailscale Funnel at
  # this port, never at the API's own port, so /admin/* is never public.
  api-gate:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    volumes:
      - ../../../services/gateway/api-gate.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../apps/status:/usr/share/nginx/status:ro
    ports:
      - "127.0.0.1:${API_GATE_PORT:-8183}:8081"

  # The Hermes skill scanner and agent blueprint compiler behind HTTP, on the internal network only (no ports, never routed by a gate).
  # The image is built by deploy/scripts/build-verifier.sh (it pins a copy of Hermes); until it exists `up` skips this service.
  verifier:
    image: ao-verifier:latest
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Probes the public addresses and internal services from outside the API and records up/degraded/down (services/prober).
  prober:
    build:
      context: ../../..
      dockerfile: services/prober/Dockerfile
    image: ao-prober:platform
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PROBER_DATABASE_URL: postgres://ao_admin:${AO_ADMIN_PASSWORD}@postgres:5432/agentic_office
      AO_STATUS_PROBES: ${PROBER_PROBES:-}

  # Turns uploaded promotion images and clips into what the app may play (ffmpeg: trim to 12 s, mute, MP4/WebM, poster, WebP).
  # Polls media_jobs as ao_admin; reads sources from and writes variants to the ao-growth-media bucket. Never reachable from outside.
  media-worker:
    build:
      context: ../../..
      dockerfile: services/api/Dockerfile.media-worker
    image: ao-media-worker:platform
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      PG_HOST: postgres
      AO_ADMIN_PASSWORD: ${AO_ADMIN_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  # pgAdmin: a database workbench in the browser. On the host itself open http://localhost:5050;
  # from the tailnet, http://<BIND_IP>:5050. It signs in with PGADMIN_EMAIL / PGADMIN_PASSWORD and
  # comes with two connections set up: "Agentic Office (admin)" as ao_admin and "(read-only)" as
  # ao_readonly. Their passwords go into a pgpass file inside the container, never into pgAdmin's
  # saved settings. Never the owner role: schema changes go through migrations.
  pgadmin:
    image: dpage/pgadmin4:9.8
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      AO_ADMIN_PASSWORD: ${AO_ADMIN_PASSWORD}
      AO_READONLY_PASSWORD: ${AO_READONLY_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        printf 'postgres:5432:agentic_office:ao_admin:%s\npostgres:5432:agentic_office:ao_readonly:%s\n' "$$AO_ADMIN_PASSWORD" "$$AO_READONLY_PASSWORD" > /tmp/pgpass
        cat > /tmp/servers.json <<'JSON'
        {"Servers": {
          "1": {"Name": "Agentic Office (admin)", "Group": "Agentic Office", "Host": "postgres", "Port": 5432,
                "MaintenanceDB": "agentic_office", "Username": "ao_admin", "PassFile": "/tmp/pgpass", "SSLMode": "prefer"},
          "2": {"Name": "Agentic Office (read-only)", "Group": "Agentic Office", "Host": "postgres", "Port": 5432,
                "MaintenanceDB": "agentic_office", "Username": "ao_readonly", "PassFile": "/tmp/pgpass", "SSLMode": "prefer"}}}
        JSON
        unset AO_ADMIN_PASSWORD AO_READONLY_PASSWORD
        exec /entrypoint.sh
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
      - "${BIND_IP}:${PGADMIN_PORT:-5050}:80"

volumes:
  pgdata:
  pgadmin:
  miniodata:
  backups:
