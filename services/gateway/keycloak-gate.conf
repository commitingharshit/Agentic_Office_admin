# The public face of Keycloak. Only what a person's browser and the desktop app need under /realms/agentic-office and the page assets
# are passed through; everything else (Keycloak's administration, the master realm, metrics, health) answers 404 here. Keycloak's own
# administration is reached over the tailnet, directly on its private port, never through this.
limit_req_zone $binary_remote_addr zone=kc_login:10m rate=20r/s;

server {
  listen 8081;
  server_tokens off;
  client_max_body_size 64k;
  client_header_buffer_size 4k;
  large_client_header_buffers 4 16k;

  # Everything we proxy tells Keycloak the public scheme, host and client address (KC_PROXY_HEADERS=xforwarded).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $kc http://keycloak:8080;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Registration of new OAuth clients stays closed.
  location ^~ /realms/agentic-office/clients-registrations { return 404; }

  location ^~ /realms/agentic-office/ {
    limit_req zone=kc_login burst=40 nodelay;
    proxy_pass $kc;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    proxy_buffer_size 16k; proxy_buffers 8 16k;
  }
  location ^~ /resources/ {
    proxy_pass $kc;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
  }
  location = /robots.txt { proxy_pass $kc; proxy_set_header Host $http_host; }

  location / { return 404; }
}
