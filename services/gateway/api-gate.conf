# The public face of the Agentic Office API. The desktop app (any computer, not only the tailnet) needs /v1/* (sign-in config, the token
# exchange, sync, plans, promotions) and /healthz. Everything else, above all /admin/*, answers 404 here: the admin API is reached by the
# console over the host's loopback, never through this. Point Tailscale Funnel at this port, not at the API's own port.
limit_req_zone $binary_remote_addr zone=api_all:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_signin:10m rate=10r/m;

server {
  listen 8081;
  server_tokens off;
  limit_req_status 429;
  # Marketplace uploads are capped at 64 MiB by the API itself; this only has to be above that.
  client_max_body_size 70m;
  client_header_buffer_size 4k;
  large_client_header_buffers 4 16k;

  # Funnel -> tailscaled -> this port. tailscaled reports the person's address in X-Forwarded-For; trust it only from the private
  # ranges (docker's bridge, loopback), so the limits below and the API's sign-in history see the person, not the proxy.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8787;

  # The public status page (apps/status, mounted read-only): a static page and its icon; it reads /v1/status from this same address.
  location = /status { limit_req zone=api_all burst=20 nodelay; add_header Cache-Control "no-cache"; try_files /index.html =404; root /usr/share/nginx/status; }
  location = /status/icon.svg { limit_req zone=api_all burst=20 nodelay; root /usr/share/nginx; try_files /status/icon.svg =404; }
  location = /healthz { access_log off; limit_req zone=api_all burst=20 nodelay; proxy_pass $api; proxy_set_header Host $http_host; }

  # Not opened to the internet yet: the e-mail provider's webhook and the payment provider's webhook (each is switched on by a person,
  # then its line is removed here). A webhook is only an observation; the API checks the signature again.
  location ^~ /v1/webhooks/ { return 404; }
  location ^~ /v1/payments/webhooks/ { return 404; }

  # Sign-in: a few tries a minute per address, so one address cannot use up the API's own allowance for everyone.
  location = /v1/auth/exchange {
    limit_req zone=api_signin burst=10 nodelay;
    limit_req zone=api_all burst=20 nodelay;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Managed inference, as /v1/ below, plus a shadow copy of each request for Laya (the router being calibrated on real traffic).
  # The person only ever gets the API's answer; Laya's is thrown away. Off while LAYA_SHADOW_URL is empty.
  location ^~ /v1/inference/ {
    limit_req zone=api_all burst=60 nodelay;
    mirror /_laya;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # The shadow copy: model requests only, without the person's token or cookies. nginx holds the connection (not the answer) until
  # this returns, so Laya must answer fast; anything slower than the timeouts is dropped.
  location = /_laya {
    internal;
    set $laya "${LAYA_SHADOW_URL}";
    if ($laya = "") { return 204; }
    if ($request_method != POST) { return 204; }
    proxy_pass $laya$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-AO-Shadow 1;
    proxy_connect_timeout 1s;
    proxy_send_timeout 2s;
    proxy_read_timeout 2s;
  }

  location ^~ /v1/ {
    limit_req zone=api_all burst=60 nodelay;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Managed inference streams its answer; never hold it back.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location / { return 404; }
}
